<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Certificate — SimplyLingua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#1B2D4F; --amber:#D97B2A; --teal:#028090; --linen:#F4EDE4;
  --bg:#F4EDE4; --fg:#1B2D4F; --card:#fff; --border:#e0d6cc;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111827; --fg:#F4EDE4; --card:#1f2937; --border:#374151; color-scheme:dark;
}}
:root[data-theme="dark"]{--bg:#111827;--fg:#F4EDE4;--card:#1f2937;--border:#374151;color-scheme:dark;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;flex-direction:column;}
header{background:var(--navy);padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem;}
header a{color:#F4EDE4;text-decoration:none;font-size:.9rem;opacity:.8;}
.wordmark{font-family:'Playfair Display',serif;font-size:1.4rem;color:#F4EDE4;}
.wordmark span{color:var(--amber);}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1rem;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2.5rem 2rem;width:100%;max-width:520px;text-align:center;}
.card h1{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--navy);margin-bottom:.5rem;}
.card p{color:#6b7280;margin-bottom:1.5rem;font-size:.95rem;}
.input-row{display:flex;gap:.5rem;margin-bottom:1rem;}
input{flex:1;padding:.75rem 1rem;border:2px solid var(--border);border-radius:8px;font-size:1rem;font-family:'Inter',sans-serif;background:var(--bg);color:var(--fg);outline:none;transition:border-color .2s;}
input:focus{border-color:var(--teal);}
button{padding:.75rem 1.25rem;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;transition:background .2s;}
button:hover{background:var(--teal);}
#result{margin-top:1.5rem;display:none;}
.valid{background:#ecfdf5;border:2px solid #10b981;border-radius:12px;padding:1.5rem;}
.invalid{background:#fef2f2;border:2px solid #ef4444;border-radius:12px;padding:1.5rem;}
.valid h2{color:#065f46;font-size:1.1rem;margin-bottom:1rem;}
.invalid h2{color:#991b1b;font-size:1.1rem;}
.cert-row{display:flex;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid #d1fae5;font-size:.9rem;}
.cert-row:last-child{border-bottom:none;}
.cert-label{font-weight:600;color:#065f46;}
.cert-value{color:#1f2937;}
.check-icon{font-size:2rem;margin-bottom:.5rem;}
footer{text-align:center;padding:1.5rem;color:#9ca3af;font-size:.85rem;}
footer a{color:var(--teal);text-decoration:none;}
</style>
</head>
<body>
<header>
  <a href="/">← Back to SimplyLingua</a>
  <div style="flex:1;text-align:center;">
    <span class="wordmark">Simply<span>Lingua</span></span>
  </div>
</header>

<main>
  <div class="card">
    <h1>Verify a Certificate</h1>
    <p>Enter a SimplyLingua certificate ID to confirm it is genuine.</p>
    <div class="input-row">
      <input type="text" id="certInput" placeholder="e.g. SL-2024-0042" autocomplete="off" spellcheck="false">
      <button onclick="verify()">Verify</button>
    </div>
    <div style="font-size:.8rem;color:#9ca3af;">Certificate IDs start with SL- followed by the year and a number.</div>

    <div id="result"></div>
  </div>
</main>

<footer>
  <a href="/">SimplyLingua Online Academy</a> · Certificate verification
</footer>

<script>
async function verify() {
  const certId = document.getElementById('certInput').value.trim().toUpperCase();
  const result = document.getElementById('result');

  if (!certId) return;

  result.style.display = 'block';
  result.innerHTML = '<div style="color:#6b7280;font-size:.9rem;padding:1rem;">Checking...</div>';

  try {
    const res = await fetch('/.netlify/functions/verify-certificate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ certId })
    });
    const data = await res.json();

    if (data.valid) {
      const date = new Date(data.issuedAt).toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
      result.innerHTML = `
        <div class="valid">
          <div class="check-icon">✅</div>
          <h2>Valid Certificate</h2>
          <div class="cert-row"><span class="cert-label">Learner</span><span class="cert-value">${data.learnerName}</span></div>
          <div class="cert-row"><span class="cert-label">Course</span><span class="cert-value">${data.course}</span></div>
          <div class="cert-row"><span class="cert-label">Level</span><span class="cert-value">${data.level}</span></div>
          <div class="cert-row"><span class="cert-label">Certificate ID</span><span class="cert-value">${data.certId}</span></div>
          <div class="cert-row"><span class="cert-label">Issued</span><span class="cert-value">${date}</span></div>
        </div>`;
    } else {
      result.innerHTML = `
        <div class="invalid">
          <div class="check-icon">❌</div>
          <h2>Certificate not found</h2>
          <p style="font-size:.9rem;color:#6b7280;margin-top:.5rem;">This ID does not match any SimplyLingua certificate. Please check and try again.</p>
        </div>`;
    }
  } catch(e) {
    result.innerHTML = '<div class="invalid"><h2>Error checking certificate. Please try again.</h2></div>';
  }
}

document.getElementById('certInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') verify();
});
</script>
</body>
</html>
